name: Update AQI

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AirNow data
        run: python3 scripts/update_aqi.py
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}

      - name: Commit aqi.json if it changed
        run: |
          if [ ! -f aqi.json ]; then echo "No aqi.json"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add aqi.json
          git diff --cached --quiet || (git commit -m "Update AQI" && git push)
